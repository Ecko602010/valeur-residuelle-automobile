services:
  - type: web
    name: valeur-residuelle-lld-loa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODEL_PATH
        value: models/modele_ml_valeur_residuelle_v2.joblib
