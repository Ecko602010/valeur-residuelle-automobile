
{% extends "base.html" %}

{% block title %}Erreur{% endblock %}

{% block content %}
<section class="panel">
  <p class="eyebrow">Une erreur est survenue</p>
  <h1>La page demandée ne peut pas être affichée</h1>
  <div class="alert alert-error" role="alert">
    <p>{{ message }}</p>
  </div>
  <a class="button-primary" href="{{ url_for('index') }}">
    Revenir à l'estimation
  </a>
</section>
{% endblock %}
